  server:
    servlet:
      context-path: /api/v1  # 모든 API 앞에 /api/v1 prefix 적용

    #compression:            # JSON 응답 gzip 압축. 대역폭 절감, 응답속도 개선.
      #enabled: true
      #mime-types: application/json
      #min-response-size: 1024
  spring:
    datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
    data:
      redis:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD}
        timeout: 3000ms
    cache:
      type: redis  # ✅ 추가
      redis:
        # ✅ 기본 TTL 설정 (10분)
        time-to-live: 600000  # 밀리초 단위 (600,000ms = 10분)
        cache-null-values: false  # null 값은 캐싱 안함 (메모리 절약)

    mvc:              # 비동기 핸들러가 영구 대기하지 않게
      async:
        request-timeout: 15000  # 15s

    jpa:
      hibernate:
        ddl-auto: none  # 개발: update, 운영: validate
      show-sql: true    # 개발 중에만 권장
      properties:
        hibernate:
          format_sql: true
          jdbc.time_zone: UTC
        #database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG16Dialect


    jackson:
      time-zone: UTC
      serialization:
        write-dates-as-timestamps: false

  gms:
    api:
      key: ${GMS_API_KEY}
      base-url: ${GMS_BASE_URL}
    path:
      openai: ${GMS_PATH_OPENAI}

  logging:
    level:
      org.springframework.web: DEBUG
      org.springframework.data.redis: DEBUG  # ✅ Redis 로그
      com.runningcity: DEBUG  # ✅ 내 코드 로그