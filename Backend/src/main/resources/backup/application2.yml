spring:
  datasource:
    url: jdbc:h2:mem:runningcity;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update     # 엔티티 기준으로 테이블 자동 생성/업데이트
    properties:
      hibernate:
        format_sql: true
        # dialect 명시 안 해도 되지만, 원하면 아래 사용
        # dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug
