stages: [deploy]

# 공통
.default_chown:
  before_script:
    - |
      # checkout 직후 남아있을 수 있는 root 소유물 교정
      docker run --rm -v "$PWD:/w" alpine:3.20 sh -lc "chown -R $(id -u):$(id -g) /w || true"
  after_script:
    - |
      # 잡 산출물도 러너 소유로 바꿔 cleanup 실패 방지
      docker run --rm -v "$PWD:/w" alpine:3.20 sh -lc "chown -R $(id -u):$(id -g) /w || true"

# frontend(블루-그린)
deploy_dev_front_static:
  stage: deploy
  environment: develop
  tags: ["run-dev-runner"]
  variables:
    COMPOSE_PROJECT_NAME: "runningcity-dev"
  extends: .default_chown
  needs:
    - job: deploy_dev_backend
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "Frontend/**/*"
        - "deploy/nginx/**/*"
        - ".gitlab-ci.yml"
        - "deploy/docker-compose.dev.yml"
  script:
    - export COMPOSE_PROJECT_NAME=runningcity-dev
    - |
      set -euo pipefail
      docker volume create npm_cache || true
      
      mkdir -p /tmp/fe_build
      docker run --rm \
        -v "/tmp/fe_build:/out" \
        alpine:3.20 sh -lc "chown -R $(id -u):$(id -g) /out && chmod 775 /out || true"

      rm -rf /tmp/fe_build/* || true

      docker run --rm \
      -e VITE_KAKAO_MAP_APP_KEY="${VITE_KAKAO_MAP_APP_KEY}" \
      -e VITE_API_ORIGIN="${VITE_API_ORIGIN}" \
        -v "$PWD/Frontend:/src:ro" \
        -v "/tmp/fe_build:/out" \
        -v npm_cache:/root/.npm \
        node:20 bash -lc '
          set -euo pipefail
          rm -rf /work && mkdir -p /work
          cp -a /src/. /work/
          cd /work
          npm ci --no-audit --no-fund
          npm run build
          cp -a dist/. /out/
        '
      
      export REL="dev-${CI_COMMIT_SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
      mkdir -p "/srv/frontend/releases/$REL"
      rsync -av --delete /tmp/fe_build/ "/srv/frontend/releases/$REL/"
      
      printf '{ "version":"%s", "builtAt":"%s" }\n' \
        "$CI_COMMIT_SHORT_SHA" "$(date -u +%FT%TZ)" \
        > "/srv/frontend/releases/$REL/version.json"
      
      /usr/local/bin/fe_switch.sh "$REL" "$CI_PROJECT_DIR"

      ok=false
      for i in {1..15}; do
        if docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" \
            curlimages/curl:8.10.1 -fsS http://nginx/version.json >/dev/null; then
          ok=true; break
        fi
        sleep 2
      done
      if [ "$ok" != true ]; then
        echo "❌ Nginx check failed"; exit 1
      fi
      
      /usr/local/bin/fe_cleanup.sh || true

# backend
deploy_dev_backend:
  stage: deploy
  environment: develop
  tags: ["run-dev-runner"]
  variables:
    COMPOSE_PROJECT_NAME: "runningcity-dev"
  extends: .default_chown
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "Backend/**/*"
        - "deploy/docker-compose.dev.yml"
        - ".gitlab-ci.yml"
  script:
    - export COMPOSE_PROJECT_NAME=runningcity-dev
    - |
      set -euo pipefail
      docker volume create gradle_cache || true
      
      docker run --rm \
        -v "$PWD/Backend:/home/gradle/project" \
        -v gradle_cache:/home/gradle/.gradle \
        -w /home/gradle/project \
        gradle:8.10.2-jdk21 bash -lc "
          set -euo pipefail
          sed -i 's/\r$//' gradlew || true
          chmod +x ./gradlew
          ./gradlew --no-daemon clean jibBuildTar
        "

      OUT="$(docker load -i Backend/build/jib-image.tar 2>&1 || true)"
      echo "$OUT"
    
      IMG="$(printf '%s\n' "$OUT" | sed -n 's/^Loaded image: //p' | head -n1)"
        if [ -n "$IMG" ]; then
        docker tag "$IMG" local/backend:develop
      else
        IMG_ID="$(printf '%s\n' "$OUT" | sed -n 's/^Loaded image ID: //p' | head -n1)"
        if [ -z "$IMG_ID" ]; then
          echo "❌ docker load: image ref not found"; exit 1
        fi
        docker tag "$IMG_ID" local/backend:develop
      fi
        
      docker compose -f deploy/docker-compose.dev.yml up -d --no-deps backend-dev
        
      ok=false
      for i in {1..30}; do
        if docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" \
            curlimages/curl:8.10.1 -fsS http://backend-dev:8080/api/v1/actuator/health >/dev/null; then
          ok=true; echo "✅ Backend UP"; break
        fi
        sleep 2
      done
      if [ "$ok" != true ]; then
        echo "❌ Backend health check failed"; exit 1
      fi

# store-assets
deploy_dev_store_assets:
  stage: deploy
  environment: develop
  tags: ["run-dev-runner"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "AssetsStore/**"
        - ".gitlab-ci.yml"
  script:
    - |
      set -euo pipefail
      mkdir -p /srv/store-assets
      rsync -av --delete AssetsStore/ /srv/store-assets/