stages: [deploy]

# 공통
.default_chown:
  before_script:
    - |
      # checkout 직후 남아있을 수 있는 root 소유물 교정
      docker run --rm -v "$PWD:/w" alpine:3.20 sh -lc "chown -R $(id -u):$(id -g) /w || true"
  after_script:
    - |
      # 잡 산출물도 러너 소유로 바꿔 cleanup 실패 방지
      docker run --rm -v "$PWD:/w" alpine:3.20 sh -lc "chown -R $(id -u):$(id -g) /w || true"

# frontend(블루-그린)
deploy_dev_front_static:
  stage: deploy
  environment: develop
  tags: ["run-dev-runner"]
  extends: .default_chown
  needs:
    - job: deploy_dev_backend
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "Frontend/**"
        - "deploy/nginx/**"
        - ".gitlab-ci.yml"
        - "deploy/docker-compose.dev.yml"
  script:
    - export COMPOSE_PROJECT_NAME=runningcity-dev
    - |
      set -euo pipefail
      docker volume create npm_cache || true
      
      mkdir -p /tmp/fe_build
      rm -rf /tmp/fe_build/* || true

      docker run --rm \
        -v "$PWD/Frontend:/src:ro" \
        -v "/tmp/fe_build:/out" \
        -v npm_cache:/root/.npm \
        node:20 bash -lc '
          set -euo pipefail
          cp -a /src/. /work && cd /work || (mkdir -p /work && cp -a /src/. /work && cd /work)
          npm ci --no-audit --no-fund
          npm run build
          cp -a dist/. /out/
        '
      
      export REL="dev-${CI_COMMIT_SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
      mkdir -p "/srv/frontend/releases/$REL"
      rsync -av --delete /tmp/fe_build/ "/srv/frontend/releases/$REL/"
      
      printf '{ "version":"%s", "builtAt":"%s" }\n' \
        "$CI_COMMIT_SHORT_SHA" "$(date -u +%FT%TZ)" \
        > "/srv/frontend/releases/$REL/version.json"
      
      /usr/local/bin/fe_switch.sh "$REL"

      /usr/local/bin/fe_cleanup.sh || true

      docker compose -f deploy/docker-compose.dev.yml up -d --no-deps nginx
      sleep 2
      docker exec nginx wget -qO- http://localhost/version.json >/dev/null || echo "⚠️ version.json not found via nginx"

# backend
deploy_dev_backend:
  stage: deploy
  environment: develop
  tags: ["run-dev-runner"]
  extends: .default_chown
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "Backend/**"
        - "deploy/docker-compose.dev.yml"
        - ".gitlab-ci.yml"
  script:
    - export COMPOSE_PROJECT_NAME=runningcity-dev
    - |
      set -euo pipefail
      docker volume create gradle_cache || true
      
      docker run --rm \
        -v "$PWD/Backend:/home/gradle/project" \
        -v gradle_cache:/home/gradle/.gradle \
        -w /home/gradle/project \
        gradle:8.10.2-jdk21 bash -lc "
          set -euo pipefail
          sed -i 's/\r$//' gradlew || true
          chmod +x ./gradlew
          ./gradlew --no-daemon clean jibBuildTar
        "
      docker load -i Backend/build/jib-image.tar

      export LAST_IMG_ID=$(docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | head -n1 | awk '{print $2}')
      docker tag "$LAST_IMG_ID" local/backend:develop || true
      
      docker compose -f deploy/docker-compose.dev.yml up -d --no-deps backend-dev
      
      echo "⌛ Waiting for backend health..."
      for i in {1..30}; do
        if docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" \
            curlimages/curl:8.10.1 -fsS \
            http://backend-dev:8080/api/v1/actuator/health >/dev/null 2>&1; then
          echo "✅ Backend UP"
          break
        fi
        sleep 2
      done