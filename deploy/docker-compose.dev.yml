services:
  redis-dev:
    image: redis:7-alpine
    ports:
      - 6379:6379
    profiles: ["infra"]

  postgres-dev:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${DEV_DB_NAME}
      POSTGRES_USER: ${DEV_DB_USER}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["infra"]

  backend-dev:
    image: local/backend:develop
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres-dev:5432/${DEV_DB_NAME}}
      SPRING_DATASOURCE_USERNAME: ${DEV_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD}
      REDIS_HOST: ${DEV_REDIS_HOST}
      REDIS_PORT: ${DEV_REDIS_PORT}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/frontend/current:/var/www/current:ro
      - /srv/store-assets:/var/www/store-assets:ro
    ports:
      - 80:80
    depends_on:
      backend-dev:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata_dev: